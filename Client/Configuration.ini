[General]
; Kernel injector pipeline configuration.
; Payload deployed by the pipeline: Assets\DLL\Target.dll (hardcoded).
; The injector driver matches the client by image name (Client.exe,
; also hardcoded). There is no hash pinning anywhere in this pipeline.
TestMode             = N
TimeoutMs            = 30000
ProcessName          = "Overwatch.exe"
Diagnostics          = N
DiscardResultLogOnSuccess = N

[Driver]
; Phase 1 telemetry targets. Do not change without re-running Prompt 1b.
TlsSlotPreference    = 16
VadSpoof             = N          ; deferred to Phase 5.5 (highest BSOD risk)
HeaderErase          = N          ; verdict C from REA analysis
ObCallbacksGadget    = storport.sys
ProviderAllowResident = N
AllocMode            = contiguous

[Mapper]
Mode                 = contiguous
DestroyHeader        = Y
NoForensics          = N
; Offsets.ini is gitignored. Regenerate on build 26300 with
; Build\Scripts\Creation\GenerateOffsets.ps1.

[Target]
Build                = 26300
PdbPin               = ntkrnlmp.pdb:26300
